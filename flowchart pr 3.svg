<svg width="680" height="610" viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Student Data Organizer program flow</title>
<desc>Flowchart showing the menu-driven loop: welcome message, display menu, validate choice, branch to run an operation or exit.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="610" fill="#ffffff"/>

<!-- Start -->
<rect x="280" y="30" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Start</text>

<line x1="340" y1="74" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Welcome message -->
<rect x="210" y="100" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Show welcome message</text>

<line x1="340" y1="144" x2="340" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Display menu (loop target) -->
<rect x="230" y="170" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Display main menu</text>

<line x1="340" y1="214" x2="340" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Get menu choice -->
<rect x="200" y="240" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Get menu choice</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Validate input 1 to 6</text>

<line x1="340" y1="296" x2="340" y2="326" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision: exit selected -->
<rect x="220" y="326" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">Exit selected?</text>
<text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#854F0B">Choice equals 6</text>

<!-- No branch -->
<path d="M250 382 L250 406 L190 406 L190 430" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="196" y="398" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#444441">No</text>

<!-- Yes branch -->
<path d="M430 382 L430 406 L515 406 L515 430" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="437" y="398" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#444441">Yes</text>

<!-- Run operation -->
<rect x="55" y="430" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="190" y="450" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Run selected operation</text>
<text x="190" y="468" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">5 available actions</text>

<!-- Exit / thank you -->
<rect x="390" y="430" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="515" y="450" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Show thank-you message</text>
<text x="515" y="468" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Exit program</text>

<!-- Loop back to menu -->
<path d="M60 458 L30 458 L30 192 L228 192" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="36" y="180" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#444441">Repeat menu</text>

<line x1="515" y1="486" x2="515" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- End -->
<rect x="455" y="520" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="515" y="542" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">End</text>

</svg>
